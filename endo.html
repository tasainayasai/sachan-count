<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <style>
        body {
    display: flex;
    flex-direction: column;  /* 縦方向に並べる */
    justify-content: center;  /* 横方向の中央 */
    align-items: center;      /* 縦方向の中央 */
    height: 100vh;            /* 高さを画面いっぱいに */
    margin: 0;                /* デフォルトのマージンを無くす */
}

button {
    font-size: 100px;
    width: 1000px;
    height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.number {
    display: block;  /* 改行を有効にする */
    margin-top: 20px; /* ボタンとpタグの間にスペースを追加 */
    font-size: 150px;
}

.counter {
    margin-top: 20px; /* ボタンとpタグの間にスペースを追加 */
    font-size: 100px;
}

.p {
    margin-top: 20px; /* ボタンとpタグの間にスペースを追加 */
    font-size: 100px;
}

html {
    background-color: rgba(109, 226, 255, 0.692);
}
    </style>
    <button class="btn">クリック！</button>
    <div>  <!-- <span>を<div>に変更 -->
        <p class="number"></p>
    </div>
    <p class="p">作った回数：<span class="counter">0</span>回</p>
    <a href="index.html"><p class="p">元に戻る</p></a>
<script>
    document.addEventListener("DOMContentLoaded", () => {
　const btn = document.querySelector(".btn");
　let count = 0;
　let counter=0;
　const newitem = document.querySelector(".number");
　const countt = document.querySelector(".counter");
　const sachi = ["い","いー","いーく","いーくん"];

　btn.addEventListener("click", () => {
    　const sound = new Audio("決定ボタンを押す44.mp3");
    　sound.play();
    　count += 1;
    　if (count <= 4){
        　newitem.textContent=sachi[count -1];
    　}else if (count === 5){
        　count = 0;
        　newitem.textContent=""
    　}

    　if (count === 4){
        　counter++;
    　}
    　countt.textContent=counter;
　});
});
</script>
</body>
</html>
